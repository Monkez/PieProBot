version: 1
toolsets:
  core:
    description: Basic low-risk runtime tools.
    tools:
      - echo
      - task.status
  memory:
    description: Local and external memory lookup.
    tools:
      - memory.search
  filesystem:
    description: File read/write tools gated by permissions.
    tools:
      - filesystem
  shell:
    description: Allowlisted shell execution, disabled by default.
    tools:
      - shell
  self_update:
    description: Self-update status and control surface.
    tools:
      - self_update.status
      - self_update.plan
  skills:
    description: Procedural memory tools for reusable workflows.
    tools:
      - skills.list
      - skills.view
      - skills.manage
      - curator.run
  research:
    includes:
      - core
      - memory
      - skills
  coding:
    includes:
      - core
      - filesystem
      - skills
  deployment:
    includes:
      - core
      - self_update
      - skills
