version: 1
name: skills.manage
description: Create, patch, write support files, or archive PiePro skills.
category: skills
enabled: true
input_schema:
  type: object
  properties:
    action:
      type: string
    name:
      type: string
    description:
      type: string
    content:
      type: string
    old:
      type: string
    new:
      type: string
    file_path:
      type: string
    reason:
      type: string
  required:
    - action
    - name
output_schema:
  type: object
permissions:
  skills: true
timeout_seconds: 10
retry_policy:
  max_retries: 0
  backoff: none
sandbox_policy:
  path_traversal_protection: true
rate_limit: {}
audit_level: full
