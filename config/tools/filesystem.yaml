version: 1
name: filesystem
description: Read or write files inside an explicit workspace
category: filesystem
enabled: true
input_schema:
  type: object
  properties:
    operation:
      type: string
    path:
      type: string
    content:
      type: string
  required:
    - path
output_schema:
  type: object
permissions:
  filesystem: true
timeout_seconds: 10
retry_policy:
  max_retries: 0
  backoff: none
sandbox_policy:
  path_traversal_protection: true
rate_limit: {}
audit_level: full

